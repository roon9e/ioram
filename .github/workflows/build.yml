name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios
      
      - name: Regenerate provisioning profiles for bundle id
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          cp -R build-system/fake-codesigning/profiles build-system/fake-codesigning/profiles-backup
          python3 build-system/Make/RegenerateProfilesForBundleId.py \
            --configurationPath=build-system/appstore-configuration.json \
            --sourceProfiles=build-system/fake-codesigning/profiles-backup \
            --destinationProfiles=build-system/fake-codesigning/profiles \
            --certsPath=build-system/fake-codesigning/certs

      - name: Normalize & Generate App Icons
        run: |
          python3 -m pip install --upgrade --break-system-packages Pillow

          python3 - << 'EOF'
          import os
          from PIL import Image

          ICON_SPECS = {
              "IconDefault-60@2x.png": (120, 120),
              "IconDefault-60@3x.png": (180, 180),
              "IconDefault-76.png": (76, 76),
              "IconDefault-76@2x.png": (152, 152),
              "IconDefault-83.5@2x.png": (167, 167),
              "IconDefault-Small-40.png": (40, 40),
              "IconDefault-Small-40@2x.png": (80, 80),
              "IconDefault-Small-40@3x.png": (120, 120),
              "IconDefault-Small.png": (29, 29),
              "IconDefault-Small@2x.png": (58, 58),
              "IconDefault-Small@3x.png": (87, 87),
              "IconDefault-1024.png": (1024, 1024),
          }

          source_path = "/Users/Shared/telegram-ios/Telegram/Telegram-iOS/logo.png"
          target_dir = "/Users/Shared/telegram-ios/Telegram/Telegram-iOS"
          xcassets_dir = os.path.join(target_dir, "DefaultAppIcon.xcassets")

          if not os.path.isfile(source_path):
              print(f"[Icon Step] No custom file found at '{source_path}'. Skipping.")
              exit(0)

          print(f"[Icon Step] Processing '{source_path}'...")
          with Image.open(source_path) as raw_img:
              img = raw_img.convert("RGB")

              if img.size != (1024, 1024):
                  print(f"[Icon Step] Resizing base from {img.size[0]}x{img.size[1]} to 1024x1024...")
                  img = img.resize((1024, 1024), Image.Resampling.LANCZOS)

              # 1. Overwrite legacy PNG icons
              for filename, size in ICON_SPECS.items():
                  dest = os.path.join(target_dir, filename)
                  resized = img.resize(size, Image.Resampling.LANCZOS)
                  resized.save(dest, "PNG")
                  print(f" -> Replaced {filename} ({size[0]}x{size[1]})")

              # 2. Overwrite all PNGs inside DefaultAppIcon.xcassets
              if os.path.isdir(xcassets_dir):
                  for root, _, files in os.walk(xcassets_dir):
                      for file in files:
                          if file.lower().endswith(".png"):
                              target_file = os.path.join(root, file)
                              with Image.open(target_file) as existing_icon:
                                  target_size = existing_icon.size
                              resized = img.resize(target_size, Image.Resampling.LANCZOS)
                              resized.save(target_file, "PNG")
                              print(f" -> Replaced Asset Catalog {target_file} ({target_size[0]}x{target_size[1]})")

          print("[Icon Step] All icons updated successfully.")
          EOF

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_FOUND=0
          for f in bazel-bin/Telegram/Telegram.ipa \
                   bazel-out/applebin_ios-ios_arm64-opt-ST-*/bin/Telegram/Telegram.ipa \
                   bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$f" ]; then
              echo "Found IPA at: $f"
              cp "$f" "$OUTPUT_PATH/"
              IPA_FOUND=1
              break
            fi
          done

          if [ $IPA_FOUND -eq 0 ]; then
            echo "ERROR: IPA file not found!"
            echo "Searching in bazel-bin:"
            ls -la bazel-bin/Telegram/ || echo "No bazel-bin/Telegram/"
            echo "Searching in bazel-out:"
            find bazel-out -name "*.ipa" 2>/dev/null || echo "No ipa found"
            exit 1
          fi

          # collect dsym
          mkdir -p build/DSYMs
          if [ -d "bazel-bin/Telegram" ]; then
            for f in bazel-bin/Telegram/*.dSYM; do
              if [ -d "$f" ]; then
                echo "Copying dSYM: $f"
                cp -R "$f" build/DSYMs/
              fi
            done
          fi
          
          if [ -z "$(ls -A build/DSYMs 2>/dev/null)" ]; then
            for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
              if [ -d "$f" ]; then
                echo "Copying dSYM from bazel-out: $f"
                cp -R "$f" build/DSYMs/
              fi
            done
          fi
          
          if [ -z "$(ls -A build/DSYMs 2>/dev/null)" ]; then
            echo "WARNING: No dSYM files found!"
          else
            echo "Found dSYM files:"
            ls -la build/DSYMs/
          fi
          
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null
          echo "Build artifacts collected successfully!"
          echo "Contents of $OUTPUT_PATH:"
          ls -la "$OUTPUT_PATH/"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false

      - name: Upload Release IPA
        id: upload-release-ipa 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          asset_name: Telegram.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        id: upload-release-dsym 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          asset_name: Telegram.DSYMs.zip
          asset_content_type: application/zip
